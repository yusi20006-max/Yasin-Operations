name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run test suite
        run: python -m pytest -q
      - name: Run production acceptance harness
        run: python scripts/production_acceptance.py --json

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Install wheel into clean virtual environment
        run: |
          python -m venv .release-venv
          . .release-venv/bin/activate
          python -m pip install dist/*.whl
          yasin-operations --help
          python -m yasin_operations --help
      - name: Verify package metadata
        run: |
          . .release-venv/bin/activate
          python -c "from importlib import metadata; print(metadata.version('yasin-operations'))"
