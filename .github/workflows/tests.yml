name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Compile source tree
        run: python -m compileall -q yasin_operations scripts
      - name: Run test suite
        run: python -m pytest -q

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install build tooling
        run: python -m pip install --upgrade build
      - name: Build wheel and source distribution
        run: python -m build --wheel --sdist
      - name: Verify built artifacts exist
        run: test -n "$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)" && test -n "$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
      - name: Install wheel into clean virtual environment
        run: |
          python -m venv .release-venv
          . .release-venv/bin/activate
          python -m pip install dist/*.whl
          cd /tmp
          EXPECTED_VERSION="$(python -c 'from importlib.metadata import version; print(version("yasin-operations"))')"
          test "$(yasin-operations --version)" = "yasin-operations ${EXPECTED_VERSION}"
          test "$(python -m yasin_operations --version)" = "yasin-operations ${EXPECTED_VERSION}"
          yasin-operations --help
          python -m yasin_operations --help
          python "$GITHUB_WORKSPACE/scripts/production_acceptance.py" --json
          python "$GITHUB_WORKSPACE/scripts/release_readiness.py" --json
          python -m pip check
      - name: Install source distribution into clean virtual environment
        run: |
          python -m venv .sdist-venv
          . .sdist-venv/bin/activate
          python -m pip install dist/*.tar.gz
          cd /tmp
          EXPECTED_VERSION="$(python -c 'from importlib.metadata import version; print(version("yasin-operations"))')"
          test "$(yasin-operations --version)" = "yasin-operations ${EXPECTED_VERSION}"
          test "$(python -m yasin_operations --version)" = "yasin-operations ${EXPECTED_VERSION}"
          python -m pip check
