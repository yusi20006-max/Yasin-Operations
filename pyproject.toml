[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yasin-operations"
version = "0.1.0"
description = "Yasin-Operations: modular Operations Agent foundation for the Yasin ecosystem"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
yasin-operations = "yasin_operations.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
test = [
    "pytest>=7.0.0",
]

[tool.setuptools]
script-files = ["scripts/yasin-operations"]

[tool.setuptools.packages.find]
where = ["."]
include = ["yasin_operations*"]
