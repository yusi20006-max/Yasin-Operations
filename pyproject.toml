[build-system]
requires = ["setuptools>=69.0.0", "wheel>=0.42.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yasin-operations"
dynamic = ["version"]
description = "Yasin-Operations: modular Operations Agent foundation for the Yasin ecosystem"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
yasin-operations = "yasin_operations.entrypoint:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
test = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["yasin_operations*"]

[tool.setuptools.dynamic]
version = {attr = "yasin_operations.version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
